# Photo order in the galleries:
#   "date"   = newest first, using the date the photo was taken (from the photo's metadata)
#   "random" = shuffled every time the page loads
photoOrder: "random"

# Text at the top of the Photography page.
photographyIntro: >-
  Aerial photography from wherever I happen to be flying. More on Instagram.

# Music button. Two options:
#   file:    put an .mp3 in public/music/ and write "/music/yourfile.mp3" here (plays quietly, no pop-up)
#   youtube: the video ID from a YouTube link (shows a small player in the corner)
# If "file" is filled in, it wins.
music:
  label: "What I've been listening to lately"
  file: "/music/portfolio-song.mp3"
  youtube: ""
