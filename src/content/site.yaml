# Which theme saahilmohal.com opens by default: "s" (Sonar) or "r" (Rolling Hills)
defaultTheme: "r"

name: "Saahil Mohal"
eyebrow: "Georgia Tech · B.S./M.S. ’27"

# The sentence under your name. Each theme can have its own.
lede:
  s: "Mechanical Engineer @ Georgia Tech. I build electrical and mechanical hardware for vehicles, and shoot aerial drone photography."
  r: "Mechanical Engineer @ Georgia Tech. I build electrical and mechanical hardware for vehicles, and shoot aerial drone photography."

# The small stat line under the hero. Add or remove lines freely.
readout:
  - label: "GPA"
    value: "3.90"
  - label: "Internships"
    value: "4"
  - label: "Base"
    value: "Atlanta / D.C. / L.A."
  - label: "Status"
    value: "Open to full-time, 2027"

# "At a glance" lines — keep each one short.
glance:
  - "4 internships"
  - "Underwater satcom"
  - "F-35 computer vision"
  - "HV power distribution"
  - "B.S. + M.S. in 4 years"

# About section on the homepage: an education line, then two columns, then a personal note.
about:
  education: >-
    I'm a Mechanical Engineering student at Georgia Tech, finishing my B.S. and M.S. together
    in four years with a focus on robotics, computer vision, and AI/ML applications.
  professional: >-
    Most recently I was an Electro-Mechanical Integration Intern at Odin Dynamics in Los Angeles,
    working on an unmanned underwater vehicle: its Starlink communications module, a thruster
    test rig, the high-voltage power board, and the surface antenna system. Before that I interned
    at Lockheed Martin in Orlando on the F-35 program, at CACI International in its National
    Security & Innovative Solutions division, and at Jefferson Millwork & Design as an architectural
    drafter. Along the way I've gotten to work on RF and structures, CFD, test rigs, computer vision,
    and machine learning.
  leadership: >-
    I serve on the WSSAC (Woodruff School Student Advisory Council), and also serve as the Technology Director 
    for Georgia Tech's Interfraternity Council, where I look after digital infrastructure and technical operations.
    I previously served on the IFC as VP of Communications, as well as a Project Lead for ElectrifyGT, running 
    projects to cut campus carbon emissions. I've also served on the executive board in my fraternity, Delta Chi,
    as the Scholarship & Professional Development Chair, Judicial Board Member, and currently as Homecoming Chair.
  personal: >-
    Outside of engineering, I'm a lifelong Eagle Scout, a pianist, and an avid drone photographer.

contact:
